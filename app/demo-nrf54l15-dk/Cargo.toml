[package]
edition = "2024"
readme = "README.md"
name = "demo-nrf54l15-dk"
version = "0.1.0"

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
nrf-pac = { workspace = true, features = ["nrf54l15-app", "rt"] }

kern = { path = "../../sys/kern" }

[build-dependencies]
build-util = { path = "../../build/util" }

# this lets you use `cargo fix`!
[[bin]]
name = "demo-nrf54l15-dk"
test = false
doctest = false
bench = false

[lints]
workspace = true
