[package]
edition = "2024"
readme = "README.md"
name = "demo-efr32mg24"
version = "0.1.0"

[features]
cpu-profiling = ["kern/cpu-profiling"]

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }

kern = { path = "../../sys/kern" }

[build-dependencies]
build-util = { path = "../../build/util" }

# this lets you use `cargo fix`!
[[bin]]
name = "demo-efr32mg24"
test = false
doctest = false
bench = false

[lints]
workspace = true
