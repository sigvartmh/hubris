[tasks.idle]
name = "task-idle"
priority = 13
max-sizes = {flash = 256, ram = 256}
stacksize = 256
start = true
# The kernel clocks SysTick from the CPU clock, which `wfi` gates in sleep,
# freezing the kernel tick. `insomniac` makes idle spin instead of sleeping so
# the tick keeps running. Trade-off: no low-power sleep in this bring-up.
features = ["insomniac"]
