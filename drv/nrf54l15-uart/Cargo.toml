[package]
name = "drv-nrf54l15-uart"
version = "0.1.0"
edition = "2024"

[dependencies]
nrf-pac = { workspace = true, features = ["nrf54l15-app"] }
userlib = { path = "../../sys/userlib" }

# This section is here to discourage RLS/rust-analyzer from doing test builds,
# since test builds don't work for cross compilation.
[[bin]]
name = "drv-nrf54l15-uart"
test = false
doctest = false
bench = false

[lints]
workspace = true
