# Memory map for the nRF54L15 application core.
#
# The application core boots and executes in place from RRAM (non-volatile)
# starting at 0x0, with 256 KiB of SRAM at 0x2000_0000. Sizes from the Zephyr
# devicetree (dts/vendor/nordic/nrf54l15.dtsi): RRAM = 1524 KiB, SRAM = 256 KiB.
# This is a standalone secure image that owns all of RRAM from address 0.

[[flash]]
address = 0x00000000
size = 0x0017D000   # 1524 KiB
read = true
execute = true

# Hubris owns the lower SRAM. The top 96 KiB (0x2002_7c00..0x2003_fc00) is
# carved out below for the FLPR core's execution memory, so Hubris stops at
# 0x2002_7c00 (~159 KiB, plenty for these tasks).
[[ram]]
address = 0x20000000
size = 0x00025C00   # 0x2000_0000 .. 0x2002_5c00
read = true
write = true
execute = false

# Shared region for crypto results + the benchmark table text, claimed via
# `extern-regions` by `cryptosrv` (writer) and `uart`/`flpr_control` (readers).
# Kept separate from the FLPR mailbox so the crypto and FLPR paths don't share
# state. 8 KiB: control words + RNG bytes + the rendered benchmark table (which
# grew large as more algorithms were added).
[[crypto_sram]]
address = 0x20025C00
size = 0x00002000   # 8 KiB: 0x2002_5c00 .. 0x2002_7c00
read = true
write = true
execute = false

# FLPR (RISC-V) execution SRAM. The `flpr-control` task copies the FLPR image
# here and the VPR core executes from it. Claimed via `extern-regions`; not part
# of the general task RAM pool. Matches Zephyr's cpuflpr_sram node.
[[flpr_sram]]
address = 0x20027C00
size = 0x00018000   # 96 KiB
read = true
write = true
execute = false
