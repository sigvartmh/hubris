# Build settings for the FLPR firmware. Requires a nightly toolchain because
# riscv32emc-unknown-none-elf is a tier-3 target with no precompiled `core`,
# so we build it from source via -Zbuild-std.
[build]
target = "riscv32emc-unknown-none-elf"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.riscv32emc-unknown-none-elf]
rustflags = ["-C", "link-arg=-Tlink.x"]
